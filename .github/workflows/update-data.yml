name: עדכון נתוני מחירון

on:
  schedule:
    - cron: '17 3 * * 0'   # כל יום ראשון ב-03:17 UTC
  workflow_dispatch:        # הרצה ידנית מלשונית Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build data/cars.json
        run: node scripts/build-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/cars.json
          git diff --cached --quiet || git commit -m "עדכון נתונים $(date -u +%F)"
          git push
